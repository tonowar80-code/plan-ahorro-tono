[project]
name = "notas-voz"
version = "0.1.0"
description = "Bot de Telegram que transcribe notas de voz y las guarda en Google Drive y Gmail."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "faster-whisper>=1.2,<2",
    "google-api-python-client>=2.150,<3",
    "google-auth-oauthlib>=1.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
notas-voz = "notas_voz.__main__:main"
notas-voz-conectar-google = "notas_voz.google_api:connect"
notas-voz-probar-google = "notas_voz.google_api:check"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notas_voz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
